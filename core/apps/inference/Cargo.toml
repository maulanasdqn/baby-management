[package]
name = "inference"
version = "0.1.0"
edition = "2021"

[lib]
name = "inference"
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { workspace = true }
tracing = { workspace = true }
burn = { version = "0.15", features = ["wgpu", "ndarray"] }
burn-wgpu = "0.15"
burn-ndarray = "0.15"
safetensors = "0.4"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
